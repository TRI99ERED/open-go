Categories:
  - Board Game
License: GPL-3.0-or-later
AuthorName: TRI99ERED
WebSite: https://github.com/TRI99ERED/open-go
SourceCode: https://github.com/TRI99ERED/open-go
IssueTracker: https://github.com/TRI99ERED/open-go/issues

AntiFeatures:
  NonFreeAssets:
    en-US: Includes Go Game Guru puzzles licensed under CC BY-NC-SA 4.0.

RepoType: git
Repo: https://github.com/TRI99ERED/open-go

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: 880c69d163e5708202cf1908785f59d596197e84
    subdir: go_app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.6
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - echo "flutter.sdk=$$flutter$$" > android/local.properties
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - go_app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub --build-name=0.1.0 --build-number=1

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: go_app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 1
