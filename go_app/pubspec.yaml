name: opengo
description: "Offline Go games against GNU Go or another local player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  gnugo_ffi:
    path: packages/gnugo_ffi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/problems/
