name: opengo
description: "Offline Go games against GNU Go or another local player."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gnugo_ffi:
    path: packages/gnugo_ffi
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/problems/
    - assets/images/
